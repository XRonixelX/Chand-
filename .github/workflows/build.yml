name: Build and Release APK

on:
  push:
    tags:
      - 'V*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        run: |
          gradle assembleRelease
          cp app/build/outputs/apk/release/*.apk Chand-v1.1.apk

      - name: Upload APK to Release V1.1
        uses: softprops/action-gh-release@v2
        with:
          files: Chand-v1.1.apk
          tag_name: V1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
